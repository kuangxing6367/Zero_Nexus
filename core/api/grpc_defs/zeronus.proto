syntax = "proto3";

package zeronus;

// Zeronus gRPC 对外服务：暴露框架内省与事件发布能力
service Zeronus {
  // 健康检查
  rpc Health(HealthRequest) returns (HealthReply);
  // 已加载插件列表
  rpc ListPlugins(ListRequest) returns (PluginList);
  // 已注册服务列表
  rpc ListServices(ListRequest) returns (ServiceList);
  // 发布一个事件到内核事件总线
  rpc EmitEvent(EmitRequest) returns (EmitReply);
}

message HealthRequest {}

message HealthReply {
  string status = 1;
  int64 timestamp = 2;
}

message ListRequest {}

message PluginInfo {
  string name = 1;
  bool enabled = 2;
}

message PluginList {
  repeated PluginInfo plugins = 1;
}

message ServiceInfo {
  string name = 1;
  string type = 2;
}

message ServiceList {
  repeated ServiceInfo services = 1;
}

message EmitRequest {
  string name = 1;
  // payload 以 JSON 字符串传递
  string payload_json = 2;
}

message EmitReply {
  bool ok = 1;
  int32 listeners = 2;
}
