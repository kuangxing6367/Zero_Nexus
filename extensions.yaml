extensions:
  onebot_adapter:
    enabled: true
    listen_host: 0.0.0.0
    listen_port: 6830
    access_token: ''
  webui:
    enabled: true
    host: 127.0.0.1
    port: 8080
  status_panel:
    enabled: true
    host: 127.0.0.1
    port: 8090
  session:
    enabled: true
  scheduler:
    enabled: true
  http_api:
    enabled: false
    host: 127.0.0.1
    port: 1145
    token: ''
    allow_db: false
  http_inject:
    enabled: false
    host: 127.0.0.1
    port: 8901
    path: /hook
    token: ''
  image_renderer:
    enabled: true
  node_manager:
    enabled: false
    interval: 30
    timeout: 5
    nodes: []
