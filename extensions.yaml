extensions:
  onebot_adapter:
    enabled: true
    listen_host: 127.0.0.1   # 供外部机器接入时改为 0.0.0.0，并同时设置 access_token
    listen_port: 6830
    access_token: ''         # 建议设置；非回环监听且留空时接入端将拒绝启动
  webui:
    enabled: true
    host: 127.0.0.1
    port: 8080
  status_panel:
    enabled: true
    host: 127.0.0.1
    port: 8090
  session:
    enabled: true
  scheduler:
    enabled: true
  http_api:
    enabled: false
    host: 127.0.0.1
    port: 1145
    token: ''
    allow_db: false
  http_inject:
    enabled: false
    host: 127.0.0.1
    port: 8901
    path: /hook
    token: ''
  image_renderer:
    enabled: true
  node_manager:
    enabled: false
    interval: 30
    timeout: 5
    nodes: []
  node_control:
    enabled: false
    host: 0.0.0.0
    port: 37010
    nodes: []          # - {name: node-1, secret: change-me}
  node_agent:
    enabled: false
    hub_host: 127.0.0.1
    hub_port: 37010
    name: ''
    secret: ''
    interval: 30
    allow_shell: false
    allow_docker: false   # docker exec / PTY 与 shell 同级，默认禁
